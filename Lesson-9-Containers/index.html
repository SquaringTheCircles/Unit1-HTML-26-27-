<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Containers and Identity</title>
    <style>
        .highlight {
            background-color: blueviolet
        }

        #site-footer {
            color: brown
        }

        .card {
            border: 3.19px dashed #4bcd3f;
            border-radius: 8px;
            background-color: bisque
        }

        .price {
            color: rgba(30, 96, 36, 0.9);
            font-weight: 600;
        }

        #main-nav {
            background: limegreen;
            color: brown
        }
    </style>
</head>

<body>
    <nav id="main-nav">...nav links...</nav>

    <p class="highlight">First Note</p>
    <p class="highlight">Second Note</p>
    <p class="highlight">Third Note</p>
    <p>A plain note - no class, no color</p>

    <!-- (div.card>h2+p)*2 -->
    <div class="card">
        <h2>Product A</h2>
        <p>First Product</p>
    </div>
    <div class="card">
        <h2>Product B</h2>
        <p>Second Product</p>
    </div>

    <p>The price is <span class="price">$29</span> today only!</p>

    <footer id="site-footer">
        @ 2026 CLUB SIGN-UP
    </footer>
</body>

</html>
